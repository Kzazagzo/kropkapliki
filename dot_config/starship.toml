# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                    
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $cmd_duration$username$hostname $directory $git_branch
# $character
# """
format = """
$cmd_duration 󰜥 $directory $git_branch$container$direnv$memory_usage$nix_shell$terraform$kubernetes
$jobs$character"""

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[  ](bold fg:blue)"
error_symbol = "[  ](bold fg:red)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg: cyan"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = "󰜥 [](bold fg:cyan)[$symbol $branch(:$remote_branch)](fg:black bg:cyan)[ ](bold fg:cyan)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold purple"
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
untracked = "🤷${count}"
modified = "📝${count}"
deleted = "${count}"
staged = "➕${count}"

[hostname]
ssh_only = false
format =  "[•$hostname](bg:cyan bold fg:black)[](bold fg:cyan)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = false
threshold = 80
symbol = "󰍛 "
style = "bg:bright-red fg:black"
format = '󰜥 [ ](bold fg:bright-red)[$symbol$ram( | $swap)]($style)[ ](bold fg:bright-red)'

[time]
disabled = false
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[jobs]
threshold = 1
number_threshold = 2
symbol = "  "
style = "fg:yellow"
format = '[$symbol$number]($style)'
disabled = false

[username]
style_user = "bold bg:cyan fg:black"
style_root = "red bold"
format = "[](bold fg:cyan)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = "  "
read_only = "  "
style = "bg:green fg:black"
read_only_style = "fg:red"
truncation_length = 6
truncation_symbol = " ••/"
format = '[](bold fg:green)[󰉋 $path]($style)[](bold fg:green)'

[container]
symbol = " "
style = "bg:blue fg:black"
format = '󰜥 [](bold fg:blue)[$symbol$name]($style)[](bold fg:blue)'
disabled = false

[direnv]
detect_files = [".envrc"]
style = "bg:yellow fg:black"
symbol = "  "
format = '󰜥 [](bold fg:yellow)[$allowed$symbol$loeaded]($style)[](bold fg:yellow)'
loaded_msg = ""
allowed_msg = ""
denied_msg = " "
unloaded_msg = " "

[nix_shell]
disabled = false
heuristic = false
symbol = " "
style = "bg:blue fg:black bold"
impure_msg = "impure"
pure_msg = "pure"
unknown_msg = ""
format = '󰜥 [](bold fg:blue)[$symbol$state(\($name\))]($style)[](bold fg:blue)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"git" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:yellow)[󰪢 $duration](bold bg:yellow fg:black)[](bold fg:yellow)'

[terraform]
disabled = false
symbol = " "
style = "bg:blue fg:black bold"
format = '󰜥 [](bold fg:blue)[$symbol$workspace]($style)[](bold fg:blue)'

[kubernetes]
disabled = false
symbol = " "
style = "bg:purple fg:black bold"
format = '󰜥 [](bold fg:purple)[$symbol$context(:$namespace)]($style)[](bold fg:purple)'
