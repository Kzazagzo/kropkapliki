font_family      JetBrains Mono Nerd Font
font_size 11.0

cursor_shape beam
cursor_trail 1

window_padding_width 21.75

background_opacity         0.9
dynamic_background_opacity yes

confirm_os_window_close 0

shell fish
shell_integration enabled

enabled_layouts splits:split_axis=horizontal,stack

map ctrl+c    copy_or_interrupt

map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

map ctrl+shift+a   launch --location=hsplit --bias 70 --title navi-menu --allow-remote-control /home/kzazagzo/.config/kitty/scripts/navi_menu.sh @active-kitty-window-id
map --when-focus-on title:navi-menu ctrl+shift+a   close_window

watcher scripts/restore/close_watchers.py
map ctrl+shift+t kitten scripts/restore/restore_window.py

map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0


map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+alt+enter launch --location=hsplit --cwd=current
map ctrl+shift+r layout_action rotate
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up neighboring_window up
map ctrl+alt+down neighboring_window down
map ctrl+shift+alt+right  resize_window narrower 4
map ctrl+shift+alt+left resize_window wider 4
map ctrl+shift+alt+up    resize_window taller 4
map ctrl+shift+alt+down  resize_window shorter 4
map ctrl+shift+alt+0     resize_window reset

# Log highlighting (error/warn/ok, docker states) - see log_marker.py
watcher log_marker.py
# kitty marks always paint both fg and bg; bg is set to the theme background
# ($term0) so only the text looks colored
mark1_foreground #ff5f5f
mark1_background #151B1E
mark2_foreground #ffd75f
mark2_background #151B1E
mark3_foreground #5fd75f
mark3_background #151B1E
